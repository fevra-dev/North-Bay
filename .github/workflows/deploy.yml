name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Least privilege: the job needs to read the repo and publish a Pages artifact, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a queued deploy finishes rather than
# being dropped mid-publish, which can leave Pages serving a half-updated site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` rather than `npm install`: installs exactly what package-lock.json pins, and
      # fails if the lockfile and package.json disagree, so a build can never silently resolve a
      # different dependency tree than the one that was reviewed (ADR-0001).
      - run: npm ci

      # Typecheck and lint gate the deploy: a build that does not typecheck never reaches the
      # live URL.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
